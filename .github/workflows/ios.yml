name: iOS

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # One run per PR (or per ref on push); a newer push cancels the older PR run.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PROJECT: Runway.xcodeproj
  SCHEME: Runway
  # Fallback only; the "Pick simulator" step overrides this with a concrete simulator id.
  DESTINATION: platform=iOS Simulator,name=iPhone 17
  DERIVED_DATA: DerivedData
  RESULTS_DIR: TestResults
  XCODE_VERSION: '27'

jobs:
  # Cheap Linux job: decides whether the macOS job needs to run at all.
  # Draft PRs run nothing; docs-only changes (*.md, docs/**) skip the macOS build.
  changes:
    name: Detect changes
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: Diff against base
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        # Fail safe: any error, or anything but a confirmed docs-only diff, means code=true.
        shell: bash {0}
        run: |
          code=true
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [ -n "$BASE_SHA" ] \
            && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            if CHANGED="$(git diff --name-only "$BASE_SHA" HEAD)" && [ -n "$CHANGED" ]; then
              echo "$CHANGED"
              if ! echo "$CHANGED" | grep -qvE '(\.md$|^docs/)'; then
                code=false
              fi
            fi
          fi
          echo "code=$code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  # Heavy macOS job. Runs unless detection explicitly said docs-only (so a failed or
  # missing detection still builds), and never for draft PRs or cancelled runs.
  build:
    name: iOS build
    needs: changes
    if: >-
      ${{ !cancelled() && needs.changes.outputs.code != 'false'
      && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: xcode-27  # public-preview macOS 27 image with Xcode 27 and iOS simulators
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Select Xcode
        run: |
          XCODE_VERSION="${XCODE_VERSION:-27}"
          ls -d /Applications/Xcode*.app || true

          if [ -d "/Applications/Xcode_${XCODE_VERSION}.app" ]; then
            XCODE_APP="/Applications/Xcode_${XCODE_VERSION}.app"
          else
            XCODE_APP="$(ls -d /Applications/Xcode_"${XCODE_VERSION}"*.app 2>/dev/null | sort -V | tail -n 1 || true)"
          fi

          if [ -n "$XCODE_APP" ]; then
            echo "Selecting $XCODE_APP"
            sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          else
            echo "No /Applications/Xcode_${XCODE_VERSION}*.app found; keeping default $(xcode-select -p)"
          fi

          xcodebuild -version
          XCODE_MAJOR="$(xcodebuild -version | awk 'NR == 1 { split($2, v, "."); print v[1] }')"
          if [ "$XCODE_MAJOR" != "$XCODE_VERSION" ]; then
            echo "::error title=Wrong Xcode::Expected Xcode ${XCODE_VERSION}.x but got Xcode ${XCODE_MAJOR:-unknown} at $(xcode-select -p)"
            exit 1
          fi
          echo "iOS Simulator SDK: $(xcrun --sdk iphonesimulator --show-sdk-version)"
          sw_vers

      - name: Lint (swift-format)
        run: |
          xcrun swift-format --version
          xcrun swift-format lint --strict --recursive Runway RunwayTests

      - name: Lint (scale factor)
        run: sh scripts/lint-scale-factor.sh

      - name: Pick simulator
        run: |
          SIMCTL_JSON="$RUNNER_TEMP/simctl-devices.json"
          xcrun simctl list devices available -j > "$SIMCTL_JSON"

          # Prints "<udid> <runtime> <name>" for the first available iPhone on the newest iOS runtime.
          PICK="$(python3 - "$SIMCTL_JSON" <<'PY'
          import json
          import re
          import sys

          with open(sys.argv[1]) as f:
              devices = json.load(f)["devices"]

          def runtime_version(key):
              match = re.search(r"SimRuntime\.iOS-([0-9-]+)$", key)
              return tuple(int(p) for p in match.group(1).split("-")) if match else None

          runtimes = sorted(
              (k for k in devices if runtime_version(k) is not None),
              key=runtime_version,
              reverse=True,
          )
          for key in runtimes:
              for device in devices[key]:
                  if device.get("isAvailable", True) and device["name"].startswith("iPhone"):
                      version = ".".join(str(p) for p in runtime_version(key))
                      print(device["udid"], f"iOS-{version}", device["name"])
                      sys.exit(0)
          sys.exit(1)
          PY
          )" || {
            echo "::error title=No simulator::No available iPhone simulator found"
            xcrun simctl list devices available
            exit 1
          }

          read -r SIM_UDID SIM_RUNTIME SIM_NAME <<< "$PICK"
          echo "Using simulator: $SIM_NAME ($SIM_RUNTIME, $SIM_UDID)"
          echo "DESTINATION=platform=iOS Simulator,id=$SIM_UDID" >> "$GITHUB_ENV"
          echo "SIM_UDID=$SIM_UDID" >> "$GITHUB_ENV"

      - name: Build for testing
        run: |
          echo "Destination: $DESTINATION"
          mkdir -p "$RESULTS_DIR"
          xcodebuild build-for-testing \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "$RESULTS_DIR/build.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=''

      - name: Test
        run: |
          xcodebuild test-without-building \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "$RESULTS_DIR/test.xcresult" \
            -only-testing:RunwayTests \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=''

      - name: Build Release for simulator
        run: |
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO

      - name: Screenshots
        run: |
          set -euo pipefail
          APP_PATH="$DERIVED_DATA/Build/Products/Debug-iphonesimulator/Runway.app"
          BUNDLE_ID=com.librandon.runway
          SCENARIOS="setup-empty setup-filled setup-warning categories category-picker"
          SCENARIOS="$SCENARIOS quick-log-empty quick-log-filled quick-log-note today-undo"
          SCENARIOS="$SCENARIOS today-normal today-near today-over today-zero today-no-budget"
          SCENARIOS="$SCENARIOS history-list history-period-summary history-edit history-before-budget history-500"
          SCENARIOS="$SCENARIOS budget-change-amounts budget-change-period budget-change-carryover budget-change-add-money budget-change-bills"
          SCENARIOS="$SCENARIOS spending-day spending-week spending-month spending-month-rolling"
          SCENARIOS="$SCENARIOS privacy-settings privacy-locked privacy-import-confirm privacy-reset-confirm"
          SCENARIOS="$SCENARIOS today-large-amount extra-money"
          ticket_for() {
            case "$1" in
              setup-*) echo 430 ;;
              categories|category-picker) echo 440 ;;
              quick-log-*|today-undo) echo 432 ;;
              today-normal|today-near|today-over|today-no-budget) echo 433 ;;
              today-zero) echo 457 ;;
              history-list|history-period-summary|history-edit) echo 434 ;;
              history-500) echo 463 ;;
              history-before-budget) echo 463b ;;
              budget-change-*) echo 435 ;;
              spending-*) echo 436 ;;
              privacy-import-confirm|privacy-reset-confirm) echo 468 ;;
              privacy-*) echo 437 ;;
              today-large-amount|extra-money) echo 469 ;;
              *) return 1 ;;
            esac
          }
          mkdir -p screenshots

          # Screenshots run on a dedicated narrow (375pt) iPhone so layout problems show up.
          TYPES_JSON="$RUNNER_TEMP/simctl-devicetypes.json"
          RUNTIMES_JSON="$RUNNER_TEMP/simctl-runtimes.json"
          xcrun simctl list devicetypes -j > "$TYPES_JSON"
          xcrun simctl list runtimes -j > "$RUNTIMES_JSON"

          # Prefer SE/mini on any available iOS runtime, newest first.
          # Otherwise keep the newest-runtime fallback (including iPhone Duo).
          # Prints nothing if neither exists.
          PICK="$(python3 - "$TYPES_JSON" "$RUNTIMES_JSON" <<'PY'
          import json
          import plistlib
          import re
          import sys
          from pathlib import Path

          PREFIX = "com.apple.CoreSimulator.SimDeviceType."
          PREFERRED = [
              PREFIX + name
              for name in [
                  "iPhone-SE-3rd-generation",
                  "iPhone-SE-2nd-generation",
                  "iPhone-13-mini",
                  "iPhone-12-mini",
              ]
          ]

          with open(sys.argv[1]) as f:
              device_types = {t["identifier"]: t for t in json.load(f)["devicetypes"]}
          with open(sys.argv[2]) as f:
              runtimes = json.load(f)["runtimes"]

          def runtime_version(runtime):
              match = re.search(r"SimRuntime\.iOS-([0-9-]+)$", runtime["identifier"])
              return tuple(int(p) for p in match.group(1).split("-")) if match else None

          def screen_points(identifier):
              """(width, height) in points from the type's profile.plist, or None."""
              bundle = device_types[identifier].get("bundlePath")
              if not bundle:
                  return None
              try:
                  with open(Path(bundle) / "Contents/Resources/profile.plist", "rb") as f:
                      profile = plistlib.load(f)
                  scale = profile["mainScreenScale"]
                  return (profile["mainScreenWidth"] / scale, profile["mainScreenHeight"] / scale)
              except (OSError, KeyError, TypeError, ZeroDivisionError, plistlib.InvalidFileException):
                  return None

          ios = [r for r in runtimes if r.get("isAvailable", True) and runtime_version(r)]
          if not ios:
              sys.exit(0)
          def supported_types(runtime):
              return {
                  t["identifier"]
                  for t in runtime.get("supportedDeviceTypes", [])
                  if t.get("identifier") in device_types
              }

          for candidate in sorted(ios, key=runtime_version, reverse=True):
              supported = supported_types(candidate)
              for choice in PREFERRED:
                  if choice in supported:
                      print(choice, candidate["identifier"], device_types[choice]["name"])
                      sys.exit(0)

          runtime = max(ios, key=runtime_version)
          supported = supported_types(runtime)
          if not supported:
              # Some images omit supportedDeviceTypes; try every installed iPhone type instead.
              supported = set(device_types)
          for t in sorted(supported):
              if device_types[t].get("name", "").startswith("iPhone"):
                  print("candidate:", device_types[t]["name"], screen_points(t), file=sys.stderr)
          print("runtime:", runtime["identifier"], file=sys.stderr)

          choice = next((t for t in PREFERRED if t in supported), None)
          if choice is None:
              iphones = [
                  t
                  for t in supported
                  if (device_types[t].get("productFamily") == "iPhone"
                      or device_types[t].get("name", "").startswith("iPhone"))
                  and screen_points(t)
              ]
              if iphones:
                  choice = min(iphones, key=lambda t: (screen_points(t), t))
          if choice is not None:
              print(choice, runtime["identifier"], device_types[choice].get("name", choice))
          PY
          )"

          SHOT_UDID="$SIM_UDID"
          if [ -n "$PICK" ]; then
            read -r SHOT_TYPE SHOT_RUNTIME SHOT_TYPE_NAME <<< "$PICK"
            echo "Screenshot device type: $SHOT_TYPE_NAME ($SHOT_TYPE, $SHOT_RUNTIME)"
            if NEW_UDID="$(xcrun simctl create "Runway Shots" "$SHOT_TYPE" "$SHOT_RUNTIME")"; then
              SHOT_UDID="$NEW_UDID"
              # Free the test simulator; screenshots don't need it.
              xcrun simctl shutdown "$SIM_UDID" || true
              xcrun simctl boot "$SHOT_UDID"
            else
              echo "::warning title=Screenshot simulator::Couldn't create $SHOT_TYPE on $SHOT_RUNTIME; using the test simulator"
            fi
          else
            echo "::warning title=Screenshot simulator::No narrow iPhone device type found; using the test simulator"
          fi
          echo "Screenshot simulator: $SHOT_UDID"

          # Boots the simulator if it's shut down, and waits until it's ready.
          xcrun simctl bootstatus "$SHOT_UDID" -b
          xcrun simctl status_bar "$SHOT_UDID" override --time 9:41
          xcrun simctl install "$SHOT_UDID" "$APP_PATH"
          # Restore appearance and text size even if a capture fails.
          reset_appearance() {
            xcrun simctl ui "$SHOT_UDID" appearance light || true
            xcrun simctl ui "$SHOT_UDID" content_size large || true
          }
          trap reset_appearance EXIT

          # capture <scenario> <output png> [launch arguments...]: relaunches and saves a shot.
          capture() {
            echo "Capturing $1 → $2"
            xcrun simctl launch --terminate-running-process "$SHOT_UDID" "$BUNDLE_ID" \
              -RunwayInMemoryStore -RunwayScreenshotScenario "$1" "${@:3}"
            sleep 6
            # Multi-display simulators (e.g. iPhone Duo) need --display; use the "(primary)" one.
            if ! xcrun simctl io "$SHOT_UDID" screenshot "$2" 2> "$RUNNER_TEMP/shot.err"; then
              cat "$RUNNER_TEMP/shot.err"
              DISPLAY_ID="$(sed -nE 's/.*--display=([0-9]+)[[:space:]]+[A-Za-z0-9-]+ \(primary\).*/\1/p' "$RUNNER_TEMP/shot.err" | head -n 1)" || true
              [ -n "$DISPLAY_ID" ] || return 1
              xcrun simctl io "$SHOT_UDID" screenshot --display="$DISPLAY_ID" "$2"
            fi
          }

          xcrun simctl ui "$SHOT_UDID" appearance light
          xcrun simctl ui "$SHOT_UDID" content_size large
          for SCENARIO in $SCENARIOS; do
            capture "$SCENARIO" "screenshots/$(ticket_for "$SCENARIO")-$SCENARIO.png"
          done

          # Largest accessibility text size. Each capture relaunches the app, so it picks this up.
          xcrun simctl ui "$SHOT_UDID" content_size accessibility-extra-extra-extra-large
          for SCENARIO in $SCENARIOS; do
            capture "$SCENARIO" "screenshots/$(ticket_for "$SCENARIO")-$SCENARIO-ax5.png"
            case "$SCENARIO" in
              setup-*)
                capture "$SCENARIO" "screenshots/$(ticket_for "$SCENARIO")-$SCENARIO-ax5-amounts.png" \
                  -RunwayScreenshotScrollTo spendable
                ;;
              history-period-summary)
                capture "$SCENARIO" "screenshots/$(ticket_for "$SCENARIO")-$SCENARIO-ax5-categories.png" \
                  -RunwayScreenshotScrollTo categories
                ;;
              history-before-budget)
                capture "$SCENARIO" "screenshots/$(ticket_for "$SCENARIO")-$SCENARIO-ax5-before-budget.png" \
                  -RunwayScreenshotScrollTo before-budget
                ;;
              today-normal|today-over)
                capture "$SCENARIO" "screenshots/467-$SCENARIO-ax5-today.png" -RunwayScreenshotScrollTo today
                ;;
              budget-change-bills)
                capture "$SCENARIO" "screenshots/467-$SCENARIO-ax5-bills.png" -RunwayScreenshotScrollTo bills
                ;;
              today-large-amount)
                capture "$SCENARIO" "screenshots/469-$SCENARIO-ax5-today.png" -RunwayScreenshotScrollTo today
                ;;
              extra-money)
                capture "$SCENARIO" "screenshots/469-$SCENARIO-ax5-extras.png" -RunwayScreenshotScrollTo extras
                capture "$SCENARIO" "screenshots/469-$SCENARIO-ax5-bills.png" -RunwayScreenshotScrollTo bills
                ;;
            esac
          done

          xcrun simctl ui "$SHOT_UDID" appearance dark
          for SIZE in large accessibility-extra-extra-extra-large; do
            xcrun simctl ui "$SHOT_UDID" content_size "$SIZE"
            SUFFIX=""
            if [ "$SIZE" != large ]; then SUFFIX="-ax5"; fi
            for SCENARIO in today-normal today-over history-list; do
              capture "$SCENARIO" "screenshots/$(ticket_for "$SCENARIO")-$SCENARIO$SUFFIX-dark.png"
            done
          done
          xcrun simctl ui "$SHOT_UDID" appearance light
          xcrun simctl ui "$SHOT_UDID" content_size large
          xcrun simctl terminate "$SHOT_UDID" "$BUNDLE_ID" || true

      - name: Upload screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: screenshots
          path: screenshots/*.png
          if-no-files-found: error
          retention-days: 7

      - name: Upload result bundles
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: xcresult-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.RESULTS_DIR }}/*.xcresult
          if-no-files-found: ignore
          retention-days: 7

  # Required check. Passes only if the iOS build succeeded, or if detection succeeded,
  # confirmed docs-only, and the build was skipped. Anything else (detection failed or
  # cancelled, build failed/cancelled/skipped unexpectedly) fails.
  # Draft PRs: skipped (drafts can't merge; marking ready triggers a full run).
  gate:
    name: Build and test
    needs: [changes, build]
    if: >-
      ${{ always()
      && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check results
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          BUILD: ${{ needs.build.result }}
        run: |
          echo "changes=$CHANGES code=$CODE build=$BUILD"
          if [ "$BUILD" = "success" ]; then
            echo "iOS build passed."
            exit 0
          fi
          if [ "$CHANGES" = "success" ] && [ "$CODE" = "false" ] && [ "$BUILD" = "skipped" ]; then
            echo "Docs-only change confirmed; iOS build skipped."
            exit 0
          fi
          echo "::error::iOS build did not succeed and the change is not confirmed docs-only."
          exit 1
